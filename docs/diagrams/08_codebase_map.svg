<text x="360" y="329" text-anchor="middle" font-size="8" font-weight="700" fill="#15803d">inherits the Cuckoo engine byte-for-byte</text>

<rect x="466" y="284" width="478" height="50" rx="4" fill="#fff" stroke="#0d7377"/>
<text x="705" y="302" text-anchor="middle" font-size="10" font-weight="700" fill="#0d7377">baselines — leach.py 76 · heed.py 65 · swarm.py 130 (PSO + GA)</text>
<text x="705" y="318" text-anchor="middle" font-size="8.5" fill="#334155">swarm.py's own docstring notes: the Latiff cost ALREADY contains the intra-cluster term Eq. 9 omits —</text>
<text x="705" y="330" text-anchor="middle" font-size="8.5" fill="#334155">which is why PSO and GA hold more energy than CSGD-NET late in the run.</text>


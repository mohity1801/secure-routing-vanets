<!-- verification column -->
<rect x="60" y="500" width="440" height="126" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.6"/>
<text x="74" y="519" font-size="11.5" font-weight="700" fill="#14532d">VERIFICATION &amp; TOOLING</text>
<text x="74" y="538" font-size="9" fill="#334155"><tspan font-weight="700">regression_gate.py · 147</tspan> — fingerprints 55 configs, SHA-256 over float64 bytes</text>
<text x="74" y="554" font-size="9" fill="#334155"><tspan font-weight="700">verify_table4.py · 153</tspan> — the 3-argument refutation of Table 4</text>
<text x="74" y="570" font-size="9" fill="#334155"><tspan font-weight="700">crypto_bench.py · 247</tspan> — ECDSA/HMAC sizes + timings + energy sweep</text>
<text x="74" y="586" font-size="9" fill="#334155"><tspan font-weight="700">verify.py 197 · verify_fit.py 74</tspan> — original audit, frame-count fit</text>
<text x="74" y="602" font-size="9" fill="#334155"><tspan font-weight="700">diagnose_fnd.py · 106</tspan> — identity/history of the first node to die</text>
<text x="74" y="619" font-size="8.5" font-style="italic" fill="#166534">These are why the project's claims are checkable rather than asserted.</text>

<rect x="516" y="500" width="444" height="126" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
<text x="530" y="519" font-size="11.5" font-weight="700" fill="#5b21b6">FORMAL — formal/  (independent of the simulator)</text>
<text x="530" y="538" font-size="9" fill="#334155">register.spdl · priority.spdl · priority-assert.spdl</text>
<text x="530" y="553" font-size="9" fill="#334155">aggregate.spdl · fusion-limit.spdl</text>
<text x="530" y="571" font-size="9" fill="#334155"><tspan font-weight="700">run_scyther.py · 168</tspan> — runs all five, compares against the</text>
<text x="530" y="584" font-size="9" fill="#334155">expected set in docs/module3.md, exits non-zero if anything moves</text>
<text x="530" y="603" font-size="9" font-weight="700" fill="#5b21b6">Shares only the DESIGN with the simulator, never code —</text>
<text x="530" y="616" font-size="9" font-weight="700" fill="#5b21b6">which is exactly why it could find a bug the simulator cannot represent.</text>

<!-- feedback loop -->
<path d="M300,626 C300,660 700,660 700,626" stroke="#c2410c" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#m2)"/>

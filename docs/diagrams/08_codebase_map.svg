<text x="500" y="656" text-anchor="middle" font-size="9.5" font-weight="700" fill="#9a3412">THE ONE FEEDBACK LOOP</text>
<text x="500" y="669" text-anchor="middle" font-size="8.5" fill="#7c2d12">crypto_bench.py → measured sizes → config.py defaults → re-run all Module 5 tables</text>


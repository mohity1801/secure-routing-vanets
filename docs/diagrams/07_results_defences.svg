<!-- energy drain panel -->
<rect x="70" y="390" width="430" height="140" rx="5" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
<text x="84" y="410" font-size="12" font-weight="700" fill="#9a3412">Energy externalised onto honest heads</text>
<text x="84" y="428" font-size="9.5" fill="#7c2d12">% of the ENTIRE network's energy budget spent forwarding falsely-urgent messages</text>
<line x1="84" y1="436" x2="486" y2="436" stroke="#fdba74"/>
<text x="94" y="452" font-size="9.5" font-weight="700" fill="#7c2d12">attacker %</text><text x="230" y="452" font-size="9.5" font-weight="700" fill="#7c2d12">urban</text><text x="330" y="452" font-size="9.5" font-weight="700" fill="#7c2d12">highway</text><text x="430" y="452" font-size="9.5" font-weight="700" fill="#7c2d12">false %</text>
<text x="94" y="470" font-size="9.5" fill="#334155">5</text><text x="230" y="470" font-size="9.5" fill="#334155">5.05</text><text x="330" y="470" font-size="9.5" fill="#334155">2.67</text><text x="430" y="470" font-size="9.5" font-weight="700" fill="#b91c1c">83 %</text>
<text x="94" y="487" font-size="9.5" fill="#334155">20</text><text x="230" y="487" font-size="9.5" font-weight="700" fill="#b91c1c">11.26</text><text x="330" y="487" font-size="9.5" fill="#334155">6.01</text><text x="430" y="487" font-size="9.5" fill="#334155">95 %</text>
<text x="94" y="504" font-size="9.5" fill="#334155">40</text><text x="230" y="504" font-size="9.5" font-weight="700" fill="#b91c1c">13.25</text><text x="330" y="504" font-size="9.5" fill="#334155">6.89</text><text x="430" y="504" font-size="9.5" fill="#334155">97 %</text>
<text x="84" y="522" font-size="9" font-style="italic" fill="#7c2d12">At just 5 % attackers, 83 % of the reservation's energy already serves liars — identical in both scenarios.</text>

<rect x="530" y="390" width="430" height="140" rx="5" fill="#f0fdf4" stroke="#15803d" stroke-width="1.6"/>
<text x="544" y="410" font-size="12" font-weight="700" fill="#14532d">Why authorisation is categorically different</text>
<line x1="544" y1="418" x2="946" y2="418" stroke="#86efac"/>
<text x="554" y="434" font-size="9.5" font-weight="700" fill="#14532d">trust</text><text x="700" y="434" font-size="9.5" font-weight="700" fill="#14532d">authorisation</text>
<text x="554" y="452" font-size="9" fill="#334155">infers from observed behaviour</text><text x="700" y="452" font-size="9" fill="#334155">verifies an unforgeable credential</text>
<text x="554" y="468" font-size="9" fill="#334155">restrained attacker EVADES it</text><text x="700" y="468" font-size="9" fill="#334155">cannot be evaded — ignores behaviour</text>
<text x="554" y="484" font-size="9" fill="#334155">has false positives</text><text x="700" y="484" font-size="9" fill="#334155">structurally impossible</text>
<text x="554" y="500" font-size="9" fill="#334155">non-zero cost at 0 attackers</text><text x="700" y="500" font-size="9" fill="#334155">exactly zero cost</text>
<text x="554" y="516" font-size="9" fill="#334155">needs rounds to gather evidence</text><text x="700" y="516" font-size="9" fill="#334155">one signature verification</text>

<!-- crypto cost -->
<rect x="70" y="544" width="430" height="140" rx="5" fill="#eff6ff" stroke="#1a3a5c" stroke-width="1.6"/>
<text x="84" y="564" font-size="12" font-weight="700" fill="#1a3a5c">What the crypto costs on the radio (16 seeds, paired Wilcoxon)</text>
<line x1="84" y1="572" x2="486" y2="572" stroke="#bfdbfe"/>
<text x="94" y="588" font-size="9" font-weight="700" fill="#1e3a5f">configuration</text><text x="300" y="588" font-size="9" font-weight="700" fill="#1e3a5f">urban</text><text x="400" y="588" font-size="9" font-weight="700" fill="#1e3a5f">highway</text>
<text x="94" y="605" font-size="9" fill="#334155">+ aggregate MAC (128 b)</text><text x="300" y="605" font-size="9" fill="#94a3b8">−0.17 % (p .63)</text><text x="400" y="605" font-size="9" fill="#334155">+0.26 % (p .004)</text>
<text x="94" y="622" font-size="9" fill="#334155">+ bypass, no signature</text><text x="300" y="622" font-size="9" fill="#334155">+1.08 % (p .083)</text><text x="400" y="622" font-size="9" fill="#334155">+0.52 % (p .002)</text>
<text x="94" y="639" font-size="9" fill="#334155">+ per-message sig (576 b)</text><text x="300" y="639" font-size="9" fill="#334155">+0.71 % (p .058)</text><text x="400" y="639" font-size="9" fill="#94a3b8">−0.00 % (p .94)</text>
<line x1="84" y1="646" x2="486" y2="646" stroke="#bfdbfe"/>
<text x="94" y="661" font-size="9.5" font-weight="700" fill="#1a3a5c">CUMULATIVE</text><text x="300" y="661" font-size="9.5" font-weight="700" fill="#1a3a5c">+1.63 %</text><text x="400" y="661" font-size="9.5" font-weight="700" fill="#1a3a5c">+0.77 %</text>
<text x="84" y="678" font-size="9" font-style="italic" fill="#1e3a5f">Say "we could not detect a per-message signature cost", NOT "the signature is free".</text>

<rect x="530" y="544" width="430" height="140" rx="5" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="544" y="564" font-size="12" font-weight="700" fill="#b91c1c">…and where the cost actually is</text>
<text x="544" y="583" font-size="9.5" fill="#7f1d1d">ECDSA P-256 sign 33.4 µs · <tspan font-weight="700">verify 97.4 µs = 2.9×</tspan></text>
<text x="544" y="597" font-size="9.5" fill="#7f1d1d">and verify is the direction CHIRP does most.</text>
<text x="544" y="616" font-size="9.5" fill="#334155">Transmitting the 72 B class-2 overhead @90 m: <tspan font-weight="700">0.078 mJ</tspan></text>
<text x="544" y="632" font-size="9.5" fill="#334155">Verifying it @25× OBU slowdown, 0.5 W: <tspan font-weight="700">1.22 mJ ≈ 15×</tspan></text>
<text x="544" y="652" font-size="9" font-style="italic" fill="#b91c1c">ESTIMATED, not measured — slowdown and power are assumptions, swept.</text>
<text x="544" y="670" font-size="9.5" font-weight="700" fill="#b91c1c">The base paper charges radio only, so its model</text>
<text x="544" y="682" font-size="9.5" font-weight="700" fill="#b91c1c">is structurally incapable of showing this.</text>
</svg>
